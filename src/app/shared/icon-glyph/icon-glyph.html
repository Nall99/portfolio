@switch (key()) {
  @case ('user') {
    <svg viewBox="0 0 40 40" class="h-full w-full">
      <circle cx="20" cy="14" r="7" fill="#8a7dfa" />
      <path d="M6 36c0-9 6-14 14-14s14 5 14 14" fill="#5b4fd6" />
    </svg>
  }
  @case ('folder') {
    <svg viewBox="0 0 40 40" class="h-full w-full">
      <path d="M4 12h11l3 4h18v18H4z" fill="#f6c94e" />
      <path d="M4 12h30v4H4z" fill="#e2ac2c" />
    </svg>
  }
  @case ('mail') {
    <svg viewBox="0 0 40 40" class="h-full w-full">
      <rect x="4" y="9" width="32" height="22" rx="2" fill="#5ee6c8" />
      <path d="M4 10l16 12L36 10" stroke="#0b3f36" stroke-width="2" fill="none" />
    </svg>
  }
  @case ('file') {
    <svg viewBox="0 0 40 40" class="h-full w-full">
      <path d="M9 3h16l7 7v27H9z" fill="#f4685e" />
      <path d="M25 3v7h7z" fill="#c73f37" />
      <rect x="13" y="17" width="14" height="2" fill="#fff" />
      <rect x="13" y="22" width="14" height="2" fill="#fff" />
      <rect x="13" y="27" width="9" height="2" fill="#fff" />
    </svg>
  }
  @case ('globe') {
    <svg viewBox="0 0 40 40" class="h-full w-full">
      <circle cx="20" cy="20" r="17" fill="#4a7dfa" />
      <path d="M3 20h34M20 3c5 5 5 29 0 34M20 3c-5 5-5 29 0 34M6 11h28M6 29h28"
            stroke="#1c3d9c" stroke-width="1.4" fill="none" />
    </svg>
  }
}
