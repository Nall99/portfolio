<div
  class="desktop-surface relative h-screen w-screen overflow-hidden bg-gradient-to-b from-bg-top via-bg-mid to-bg-bottom font-ui select-none"
  (click)="clearSelection()"
>
  <div class="absolute top-4 left-4 z-10 flex flex-col gap-1.5">
    @for (win of windowService.windows(); track win.id) {
      <app-icon
        [windowId]="win.id"
        [label]="win.title"
        [iconKey]="win.icon"
        [selected]="selectedIcon === win.id"
        (select)="selectIcon($event)"
        (open)="windowService.open($event)"
      />
    }
  </div>

  @for (win of windowService.openWindows(); track win.id) {
    <app-window [win]="win">
      @switch (win.id) {
        @case ('sobre-mim') { <app-sobre-mim/> }
        @case ('projetos') { <app-projetos/> }
        @case ('contato') { <app-contato/> }
        @case ('curriculo') { <app-curriculo/> }
        @case ('redes-sociais') { <app-redes-sociais/> }
      }
    </app-window>
  }
  <app-taskbar/>
</div>
