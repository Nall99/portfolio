<div
  class="flex w-[clamp(4.5rem,7vw,7.5rem)] flex-col items-center gap-1.5 rounded p-2 cursor-pointer border border-transparent hover:bg-accent/10"
  [class.bg-accent/20]="selected()"
  [class.border-accent/40]="selected()"
  (click)="select.emit(windowId())"
  (dblclick)="open.emit(windowId())"
>
  <div class="flex h-[clamp(2.5rem,4.5vw,4.5rem)] w-[clamp(2.5rem,4.5vw,4.5rem)] items-center justify-center drop-shadow-md">
    <app-icon-glyph [key]="iconKey()" />
  </div>
  <span class="max-w-full text-center text-[clamp(10px,1vw,14px)] leading-tight text-white/90 [text-shadow:0_1px_2px_rgba(0,0,0,.9)]">
    {{ label() }}
  </span>
</div>
