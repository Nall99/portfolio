<div
  class="flex w-[clamp(4rem,4.5vw,10rem)] flex-col items-center gap-1.5 rounded p-2 cursor-pointer border border-transparent hover:bg-accent/10"
  [class.bg-accent/20]="selected()"
  [class.border-accent/40]="selected()"
  (click)="abrir()"
>
  <div class="flex h-[clamp(2.25rem,3vw,6rem)] w-[clamp(2.25rem,3vw,6rem)] items-center justify-center drop-shadow-md">
    <app-icon-glyph [key]="iconKey()" />
  </div>
  <span class="max-w-full text-center text-[clamp(10px,0.65vw,16px)] leading-tight text-white/90 [text-shadow:0_1px_2px_rgba(0,0,0,.9)]">
    {{ label() }}
  </span>
</div>
