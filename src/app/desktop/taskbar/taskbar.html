<!-- Menu Iniciar -->
@if (isStartOpen()) {
  <div
    class="fixed left-0 z-[200] w-[clamp(240px,20vw,340px)] overflow-hidden rounded-t-md border border-taskbar-border bg-[#151a30] shadow-2xl"
    [style.bottom]="'var(--taskbar-h)'"
  >
    <div
      class="flex items-center gap-2.5 bg-gradient-to-br from-start-1 to-start-2 px-3.5 py-3 text-white"
    >
      <img
        src="/images/avatar.png"
        alt="Foto de Allan Victor"
        class="h-[clamp(1.75rem,3vw,2.5rem)] w-[clamp(1.75rem,3vw,2.5rem)] flex-none rounded border border-white/30 object-cover"
      />
      <strong class="text-[clamp(12px,1.1vw,15px)]">Allan Victor</strong>
    </div>

    <ul class="p-2">
      @for (win of windowService.windows(); track win.id) {
        <li
          class="flex cursor-pointer items-center gap-2.5 rounded px-2.5 py-2 text-[clamp(11px,1vw,14px)] text-white/85 hover:bg-accent/15 hover:text-white"
          (click)="onMenuItemClick(win.id)"
        >
          <span class="h-[clamp(1.125rem,1.6vw,1.5rem)] w-[clamp(1.125rem,1.6vw,1.5rem)] flex-none"
            ><app-icon-glyph [key]="win.icon"
          /></span>
          {{ win.title }}
        </li>
      }
    </ul>
  </div>
}

<!-- Taskbar -->
<div
  class="fixed inset-x-0 bottom-0 z-[100] flex items-stretch border-t border-taskbar-border bg-gradient-to-b from-taskbar-2 to-taskbar-1 shadow-[0_-2px_12px_rgba(0,0,0,.4)]"
  [style.height]="'var(--taskbar-h)'"
>
  <button
    class="flex items-center gap-2 border-r border-black/40 bg-gradient-to-b from-start-1 to-start-2 px-[clamp(0.625rem,1.2vw,1.25rem)] font-extrabold italic text-white text-[clamp(13px,1.2vw,17px)] hover:brightness-110"
    (click)="toggleStart()"
  >
    <span
      class="grid h-[clamp(0.875rem,1.4vw,1.375rem)] w-[clamp(0.875rem,1.4vw,1.375rem)] grid-cols-2 grid-rows-2 gap-0.5"
    >
      <span class="bg-accent"></span><span class="bg-[#8a7dfa]"></span>
      <span class="bg-[#f6c94e]"></span><span class="bg-[#f4685e]"></span>
    </span>
    start
  </button>

  <div class="flex flex-1 items-center gap-0.4 overflow-x-auto ">
  @for (win of windowService.openWindows(); track win.id) {
    <button
      class="flex max-w-[clamp(140px,14vw,220px)] flex-none items-center self-stretch gap-1.5 truncate rounded border border-taskbar-border bg-gradient-to-b from-[#1c2242] to-[#12162c] px-[clamp(0.5rem,0.8vw,0.875rem)] text-[clamp(11px,0.95vw,14px)] text-white/80"

      [class.border-accent-dim]="windowService.activeWindowId() === win.id && !win.isMinimized"
      [class.from-title-active-1]="windowService.activeWindowId() === win.id && !win.isMinimized"
      [class.to-[#1a2044]]="windowService.activeWindowId() === win.id && !win.isMinimized"
      [class.text-white]="windowService.activeWindowId() === win.id && !win.isMinimized"
      (click)="onTaskClick(win.id)"
    >
      <span class="h-[clamp(0.875rem,1.4vw,1.25rem)] w-[clamp(0.875rem,1.4vw,1.25rem)] flex-none">
        <app-icon-glyph [key]="win.icon" />
      </span>
      <span class="truncate">{{ win.title }}</span>
    </button>
  }
</div>

  <div
    class="flex items-center gap-2.5 border-l border-white/5 px-[clamp(0.625rem,1.2vw,1.25rem)] text-[clamp(11px,0.95vw,14px)] text-white/80"
  >
    <span>{{ clock() }}</span>
  </div>
</div>
