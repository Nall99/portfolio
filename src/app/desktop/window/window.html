@if (!win().isMinimized) {
<div
  class="absolute flex flex-col overflow-hidden rounded-lg border border-black/70 bg-window-bg shadow-2xl"
  [class.rounded-none]="win().isMaximized"
  [style.left.px]="0"
  [style.top.px]="0"
  [style.width]="win().isMaximized ? '100%' : win().size.width + 'px'"
  [style.height]="win().isMaximized ? 'calc(100% - 38px)' : win().size.height + 'px'"
  [style.z-index]="win().zIndex"
  (mousedown)="onFocus()"
  cdkDrag
  cdkDragBoundary=".desktop-surface"
  [cdkDragFreeDragPosition]="win().isMaximized ? { x: 0, y: 0 } : win().position"
  [cdkDragDisabled]="win().isMaximized"
  (cdkDragEnded)="onDragEnded($event)"
>
    <div
      class="flex h-8 flex-none cursor-move items-center justify-between px-2 bg-gradient-to-b"
      [class.from-title-active-1]="isActive()"
      [class.to-title-active-2]="isActive()"
      [class.from-title-inactive-1]="!isActive()"
      [class.to-title-inactive-2]="!isActive()"
      cdkDragHandle
    >
      <span class="truncate text-xs font-semibold text-white">{{ win().title }}</span>
      <div class="flex gap-1">
        <button
          class="h-5 w-5 rounded border border-white/20 bg-white/10 text-[11px] text-white hover:bg-white/20"
          (click)="minimize($event)"
        >—</button>
        <button
          class="h-5 w-5 rounded border border-white/20 bg-white/10 text-[11px] text-white hover:bg-white/20"
          (click)="toggleMaximize($event)"
        >❐</button>
        <button
          class="h-5 w-5 rounded border border-red-900/40 bg-white/10 text-[11px] text-white hover:bg-red-600"
          (click)="close($event)"
        >✕</button>
      </div>
    </div>

    <div class="flex-1 overflow-auto p-4 text-sm text-gray-800">
      <ng-content></ng-content>
    </div>
  </div>
}
